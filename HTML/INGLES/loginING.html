<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Canrisk</title>
    <link rel="stylesheet" href="../../Css/register.css">
    <link rel="icon" type="image/png" href="../../MULTIMEDIA/Canrisk LOGO.png">
</head>
<body>
    <div>
        <div class="form">
            <form action="">
            <h1>Login</h1><br><br>
            <label class ="User-text"for="user">User:</label><br>
            <input type="text" id="username" name="username" placeholder="Enter your username" class="username" required><br>
            <label class ="User-text"for="password">Password:</label><br><br>
            <input type="password" id="password" name="password" placeholder="Enter your password" class="password" required><br><br>
            <div class="submit-bttn">
                <button type="submit" class="submit-bttn" id="submit-bttn">Enter!</button>
                <label class="submit-bttn" for="submit" ></label>
            </div>
            <br>
            <button class="regresar" onclick="window.history.back()">Return</button>
            <div class="register">
                <a class="resgis-txt" href="../../HTML/INGLES/register.html">Don't have an account?
                <br>
                Register here!</a>
            </div>
            </form>
        </div>
    </div>    

    <script src="../../JS/login.js"></script>
</body>
</html>
